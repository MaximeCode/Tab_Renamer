<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 350px;
      padding: 16px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      position: relative;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
      color: #202124;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    input:focus {
      outline: none;
      border-color: #1a73e8;
    }

    button {
      width: 100%;
      padding: 8px 16px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1557b0;
    }

    button:active {
      background-color: #0d47a1;
    }

    .reset-btn {
      background-color: #f1f3f4;
      color: #5f6368;
      margin-top: 8px;
    }

    .reset-btn:hover {
      background-color: #e8eaed;
    }

    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .status.success {
      background-color: #e6f4ea;
      color: #137333;
      display: block;
    }

    .status.error {
      background-color: #fce8e6;
      color: #c5221f;
      display: block;
    }

    .lang-switcher {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      background: #f1f3f4;
      border-radius: 4px;
      padding: 2px;
    }

    .lang-btn {
      width: auto;
      padding: 4px 8px;
      background: transparent;
      color: #5f6368;
      font-size: 12px;
      margin: 0;
      border-radius: 2px;
      min-width: 32px;
      transition:
        background-color 0.2s ease,
        color 0.2s ease;
    }

    .lang-btn:hover {
      background: #e8eaed;
    }

    .lang-btn.active {
      background: #1a73e8;
      color: white;
    }

    .lang-btn.active:hover {
      background: #1557b0;
    }

    .match-type-container {
      margin-bottom: 12px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
      border: 1px solid #e8eaed;
    }

    .match-type-label {
      font-size: 12px;
      font-weight: 500;
      color: #5f6368;
      margin-bottom: 8px;
      display: block;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #202124;
    }

    .radio-option input[type="radio"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .radio-option label {
      cursor: pointer;
      flex: 1;
      margin: 0;
    }

    .match-sub-input {
      margin-top: 4px;
      font-size: 12px;
      padding: 6px 8px;
      margin-bottom: 4px;
    }

    .match-sub-input[type="hidden"] {
      display: none;
    }

    .db-mode-container {
      margin-bottom: 12px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 4px;
      border: 1px solid #e8eaed;
    }

    .db-mode-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #202124;
      cursor: pointer;
    }

    .db-mode-option input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .db-mode-option label {
      cursor: pointer;
      flex: 1;
      margin: 0;
    }

    .db-mode-hint {
      margin-top: 6px;
      font-size: 11px;
      color: #5f6368;
    }

    .db-mode-warning {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 4px;
      font-size: 12px;
      background-color: #fef7e0;
      color: #b06000;
      border: 1px solid #f0d890;
      display: none;
    }

    .db-mode-warning.visible {
      display: block;
    }

    .section-divider {
      border: none;
      border-top: 1px solid #e8eaed;
      margin: 14px 0 12px 0;
    }

    .favicon-section-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #5f6368;
      margin-bottom: 8px;
    }

    .favicon-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .favicon-preview-wrapper {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      overflow: hidden;
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #faviconPreview {
      display: block;
    }

    #faviconInput {
      display: none;
    }

    .favicon-choose-btn {
      flex: 1;
      padding: 7px 10px;
      border: 1px dashed #dadce0;
      border-radius: 4px;
      font-size: 13px;
      color: #5f6368;
      cursor: pointer;
      text-align: center;
      background: #f8f9fa;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
      display: block;
      box-sizing: border-box;
      margin-bottom: 0;
      line-height: 1.4;
    }

    .favicon-choose-btn:hover {
      background: #e8eaed;
      border-color: #1a73e8;
      color: #1a73e8;
    }
  </style>
</head>

<body>
  <div class="lang-switcher">
    <button id="langFr" class="lang-btn active" data-lang="fr">FR</button>
    <button id="langEn" class="lang-btn" data-lang="en">EN</button>
  </div>
  <h3 id="titleText">Renommer cet onglet</h3>
  <input type="text" id="tabName" placeholder="Entrez le nouveau nom..." />
  <div class="match-type-container">
    <span class="match-type-label" id="matchTypeLabel">Type de correspondance :</span>
    <div class="radio-group">
      <div class="radio-option">
        <input type="radio" id="matchExact" name="matchType" value="exact" checked />
        <label for="matchExact" id="matchExactLabel">URL exacte</label>
      </div>
      <input type="text" id="matchExactInput" class="match-sub-input" placeholder="URL exacte..." />
      <!--  -->
      <div class="radio-option">
        <input type="radio" id="matchPrefix" name="matchType" value="prefix" />
        <label for="matchPrefix" id="matchPrefixLabel">URL commence par</label>
      </div>
      <input type="text" id="matchPrefixInput" class="match-sub-input" type="hidden"
        placeholder="URL commence par..." />
      <!--  -->
      <div class="radio-option">
        <input type="radio" id="matchRegex" name="matchType" value="regex" />
        <label for="matchRegex" id="matchRegexLabel">Regex</label>
      </div>
      <input type="text" id="matchRegexInput" class="match-sub-input" type="hidden" placeholder="Regex pattern..." />
      <!--  -->
    </div>
  </div>
  <div class="db-mode-container">
    <div class="db-mode-option">
      <input type="checkbox" id="devModeToogle" />
      <label for="devModeToogle" id="devModeLabel">Mode Dev : DB</label>
    </div>
    <div class="db-mode-hint" id="dbModeHint">
      Analyse l'URL pour associer un nom à une base et une table.
    </div>
    <div id="dbModeWarning" class="db-mode-warning" role="alert">
      <span id="dbModeWarningText"></span>
    </div>
  </div>

  <span class="favicon-section-label" id="faviconSectionLabel">Favicon personnalisé</span>
  <div class="favicon-row">
    <div class="favicon-preview-wrapper">
      <canvas id="faviconPreview" width="32" height="32"></canvas>
    </div>
    <label class="favicon-choose-btn" for="faviconInput" id="faviconChooseBtn">Choisir une image…</label>
    <input type="file" id="faviconInput" accept="image/*" />
  </div>
  <div id="status" class="status"></div>
  <hr class="section-divider" />

  <button id="renameBtn">Appliquer</button>
  <button id="resetBtn" class="reset-btn">Réinitialiser</button>

  <script src="popup.js"></script>
</body>

</html>
